name: Kelnix validation

on:
  push:
    branches:
      - main
      - feat/international-dropshipping-foundation
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build storefront
        run: npm run build

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/initiate-paychangu-payment/index.ts
          deno check supabase/functions/verify-paychangu-payment/index.ts
          deno check supabase/functions/paychangu-webhook/index.ts
          deno check supabase/functions/jarvis-outbox/index.ts
